services:
  street-cat-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: street_cat_tracker_app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      # Canlı kod değişiklikleri için çalışma alanını bağla
      - .:/app
      # Host makinenin container içindeki node_modules klasörünü ezmesini önleyen anonim hacim
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
    stdin_open: true
    tty: true
    # Ezilme durumuna ve yeni paketlere karşı kesin çözüm:
    # node_modules boşsa veya expo/async-storage eksikse otomatik npm install çalıştırır
    command: >
      sh -c "if [ ! -d '/app/node_modules/expo' ] || [ ! -d '/app/node_modules/@react-native-async-storage/async-storage' ] || [ ! -d '/app/node_modules/expo-image-picker' ]; then
               echo '>>> Eksik veya ezilen paketler tespit edildi. Container icinde npm install calistiriliyor...' && npm install;
             fi && npx expo start --web --host lan"
