services:
  street-cat-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: street_cat_tracker_app
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:19000:19000"
      - "0.0.0.0:19001:19001"
      - "0.0.0.0:19002:19002"
    environment:
      # LAN erisimi icin ana makinenin yerel ag IP adresi (varsayilan: 0.0.0.0)
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-0.0.0.0}
    volumes:
      # Canlı kaynak kod senkronizasyonu
      - .:/app
      # Host makinenin node_modules klasörünü ezmesini önleyen yalıtılmış hacim
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npx expo start --host lan
