services:
  street-cat-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: street_cat_tracker_app
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:19000:19000"
      - "0.0.0.0:19001:19001"
      - "0.0.0.0:19002:19002"
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP}
    volumes:
      # Canlı kod senkronizasyonu
      - .:/app
      # Host makinenin node_modules klasörünü ezmesini önleyen anonim hacim
      - /app/node_modules
      - ~/.expo:/root/.expo
    stdin_open: true
    tty: true
    command: npx expo start --host lan
