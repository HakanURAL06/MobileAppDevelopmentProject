services:
  street-cat-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: street_cat_tracker_app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      # Canlı kod değişiklikleri için çalışma alanını bağla (Hot-Reload)
      - .:/app
      # Host makinenin container içindeki node_modules klasörünü ezmesini önleyen anonim hacim
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Mac Wi-Fi IP adresiniz: Metro Bundler bu IP ile exp://192.168.x.x:8081 yayını yapar
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME:-192.168.1.170}
    stdin_open: true
    tty: true
    # SDK 57 bağımlılıklarını container içinde hazırla ve LAN yayını yap
    command: >
      sh -c "npm install && npx expo start --host lan"
